    <!-- Google Fonts: Syne (Display Cinematográfico) e Inter (Interface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],

                    colors: {
                        studio: {
                            bg: '#05070c',
                            surface: '#0C0F1A',
                            navy: '#0d1b3e',
                            velvet: '#1B2A59',
                            silver: '#cbd5e1',
                            gold: '#e5c158',
                            starlight: '#FDE68A',

                        dsbee: {

                            neon: '#10B981',
                            violet: '#8B5CF6',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Dark Studio: Preto Profundo + Azul-Marinho Aveludado */
        body {
            background-color: #05070c;
            color: #F1F5F9;
            overflow-x: hidden;
        }

        /* Glassmorphism de Estúdio */
        .glass-nav {
            background: rgba(9, 12, 22, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(203, 213, 225, 0.12);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(16, 22, 42, 0.82) 0%, rgba(7, 9, 16, 0.94) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(203, 213, 225, 0.09);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(203, 213, 225, 0.22);
        }

        .mago-hover:hover {
            border-color: rgba(234, 179, 8, 0.5);
            box-shadow: 0 18px 42px -14px rgba(234, 179, 8, 0.2);
        }

        .dsbee-hover:hover {
            border-color: rgba(16, 185, 129, 0.45);
            box-shadow: 0 18px 42px -14px rgba(27, 42, 89, 0.45);
        }

        /* Frame Cinematográfico da Vinheta */
        .cinema-frame {
            background: radial-gradient(circle at 50% 45%, rgba(27, 42, 89, 0.38) 0%, rgba(5, 6, 10, 0.98) 78%);
            border: 1px solid rgba(203, 213, 225, 0.16);
            box-shadow:
                0 25px 70px -18px rgba(0, 0, 0, 0.95),
                0 0 60px -22px rgba(234, 179, 8, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* Textura sutil de película cinematográfica */
        .film-grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Scrollbar discreta */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #05060A;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 4px;
        }
